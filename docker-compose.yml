# ─────────────────────────────────────────────────────────────
# VitalBridge — One-Command Deployment
# Run: docker-compose up --build
# ─────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ── PostgreSQL Database ──
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vitalbridge
      POSTGRES_PASSWORD: vitalbridge_secret
      POSTGRES_DB: vitalbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://vitalbridge:vitalbridge_secret@db:5432/vitalbridge
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-64-char-hex-string}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-grok-3-mini}
      GROK_BASE_URL: ${GROK_BASE_URL:-https://api.x.ai/v1}
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
      DEBUG: "false"
      IOT_DEMO_DAY_SECONDS: "120"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── React Frontend (nginx) ──
  web:
    build: ./web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
