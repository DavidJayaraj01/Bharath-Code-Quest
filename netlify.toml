[build]
  base = "web"
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/*"
  to = "https://your-backend-api-url.onrender.com/api/:splat" # Replace with your actual production backend URL (e.g. on Render/Railway)
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
